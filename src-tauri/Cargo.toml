[package]
name = "mega-brain-desktop"
version = "0.1.0"
description = "Mega Brain desktop shell"
authors = ["Mega Brain"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mega_brain_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
